<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    /* Reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 20px;
      line-height: 1.5;
    }
    .pdf-container {
      max-width: 100%;
      font-size: 12pt;
    }

    /* Encabezado */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28pt;
      font-weight: 700;
      color: #1e3a8a; /* azul oscuro */
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .header .badge {
      font-size: 10pt;
      font-weight: 600;
      color: #1e3a8a;
      background: #dbeafe;
      padding: 2px 14px;
      border-radius: 20px;
      display: inline-block;
    }
    .divider {
      border-top: 2px solid #1e3a8a;
      margin: 16px 0;
    }

    /* Datos del cliente */
    .client-info {
      margin-bottom: 16px;
    }
    .client-info p {
      margin: 4px 0;
    }
    .client-info strong {
      font-weight: 600;
      color: #1e3a8a;
    }

    /* Lista de servicios */
    .services {
      margin: 16px 0;
    }

    /* Cada servicio: fondo azul claro, borde redondeado */
    .service-item {
      background-color: #eff6ff;    /* azul muy claro */
      border-left: 6px solid #1e3a8a;
      border-radius: 4px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
    }

    .service-name {
      font-weight: 700;
      color: #1e3a8a;        /* azul oscuro */
      flex: 1 1 60%;
      font-size: 12pt;
      word-wrap: break-word;
      white-space: normal;
    }
    .service-price {
      font-weight: 700;
      color: #1e3a8a;
      white-space: nowrap;
      font-size: 12pt;
    }
    .service-detail {
      font-size: 10pt;
      color: #374151;
      width: 100%;
      margin-top: 6px;
      padding-left: 12px;
      border-left: 3px solid #93c5fd;
      word-wrap: break-word;
      white-space: normal;
    }

    /* Total */
    .total {
      text-align: right;
      font-size: 18pt;
      font-weight: 700;
      margin-top: 20px;
      color: #1e3a8a;
      border-top: 2px solid #1e3a8a;
      padding-top: 12px;
    }

    /* Pie de página */
    .footer {
      margin-top: 40px;
      font-size: 9pt;
      color: #6b7280;
      border-top: 1px solid #d1d5db;
      padding-top: 12px;
      text-align: center;
    }
    .footer p {
      margin: 2px 0;
    }

    @media print {
      body { padding: 0; }
      .pdf-container { margin: 0; }
    }
  </style>
</head>
<body>
<div class="pdf-container">
  <!-- Encabezado -->
  <div class="header">
    <h1>actols</h1>
    <span class="badge">Cotización</span>
  </div>
  <div class="divider"></div>

  <!-- Cliente -->
  <div class="client-info">
    <p><strong>Cliente:</strong> {{clientName}}</p>
    <p><strong>Producto o servicio:</strong> {{productName}}</p>
    <p><strong>Fecha:</strong> {{date}}</p>
  </div>
  <div class="divider"></div>

  <!-- Servicios -->
  <div class="services">
    {{services}}
  </div>

  <!-- Total -->
  <div class="total">Total: {{total}}</div>

  <!-- Pie -->
  <div class="footer">
    <p>Esta cotización es válida por 30 días.</p>
    <p>powered by actols</p>
  </div>
</div>
</body>
</html>
