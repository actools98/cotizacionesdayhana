<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    /* ==========================================================
       RESET Y BASE (todo debe caber en 1080px)
       ========================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      width: 1080px;
      overflow: hidden;
      line-height: 1.4;
    }
    .pdf-container {
      width: 100%;
      max-width: 100%;
      background: #ffffff;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* ==========================================================
       ENCABEZADO: LOGO + BADGE
       ========================================================== */
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding: 0 10px;
    }
    .header .logo-img {
      height: 60px;
      width: auto;
      display: block;
      margin: 0 auto 4px auto;
      max-width: 100%;
    }
    .header .badge {
      font-size: 8pt;
      font-weight: 600;
      color: #000000;
      background: #e8e8e8;
      padding: 2px 12px;
      border-radius: 20px;
      display: inline-block;
      letter-spacing: 0.3px;
    }

    /* ==========================================================
       DIVISOR
       ========================================================== */
    .divider {
      border-top: 1px solid #1e3a8a;
      margin: 10px 10px;
    }

    /* ==========================================================
       INFORMACIÓN DEL CLIENTE
       ========================================================== */
    .client-info {
      margin: 0 10px 12px 10px;
      font-size: 9pt;
    }
    .client-info p {
      margin: 2px 0;
    }
    .client-info strong {
      font-weight: 600;
      color: #000000;
    }

    /* ==========================================================
       TABLA DE SERVICIOS (TAMAÑO MÍNIMO)
       ========================================================== */
    .services-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 8pt; /* TAMAÑO MÍNIMO */
      table-layout: fixed;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .services-table th,
    .services-table td {
      word-break: break-all;
      overflow-wrap: break-word;
      padding: 2px 4px; /* PADDING MÍNIMO */
      vertical-align: top;
      box-sizing: border-box;
    }

    /* Columna de servicios: ocupa 72% del ancho */
    .services-table th:first-child,
    .services-table td:first-child {
      width: 72%;
      max-width: 72%;
    }

    /* Columna de precios: ocupa 28% del ancho */
    .services-table th:last-child,
    .services-table td:last-child {
      width: 28%;
      max-width: 28%;
      text-align: right;
    }

    .services-table th {
      background-color: #000000;
      color: #ffffff;
      font-weight: 600;
      font-size: 8pt;
      text-align: left;
    }
    .services-table th:last-child {
      text-align: right;
    }

    .service-row td {
      background-color: #ffffff;
    }

    .service-name {
      font-weight: 700;
      color: #000000;
      display: block;
      margin-bottom: 2px;
      font-size: 8pt;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .service-detail {
      font-size: 7pt;
      color: #333333;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: break-word;
      background-color: #f2f6fa;
      padding: 2px 4px;
      border-radius: 3px;
      border-left: 2px solid #000000;
      margin-top: 2px;
      display: block;
      line-height: 1.3;
    }

    .service-price {
      font-weight: 700;
      color: #000000;
      text-align: right;
      white-space: normal;
      display: block;
      font-size: 8pt;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .total-row td {
      background-color: #ffffff;
      padding: 6px 8px;
      font-weight: 700;
      color: #000000;
      font-size: 10pt;
    }
    .total-row .total-label {
      text-align: left;
    }
    .total-row .total-value {
      text-align: right;
      white-space: normal;
      word-break: break-all;
    }

    /* ==========================================================
       PIE DE PÁGINA
       ========================================================== */
    .footer {
      margin: 20px 10px 0 10px;
      font-size: 7pt;
      color: #6b7280;
      border-top: 1px solid #d6d6d6;
      padding-top: 8px;
      text-align: center;
    }
    .footer p {
      margin: 2px 0;
    }
  </style>
</head>
<body>
<div class="pdf-container">
  <div class="header">
    <img src="/logo2.png" alt="TBA" class="logo-img" />
    <span class="badge">Cotización</span>
  </div>
  <div class="divider"></div>
  <div class="client-info">
    <p><strong>Cliente:</strong> {{clientName}}</p>
    <p><strong>Producto o servicio:</strong> {{productName}}</p>
    <p><strong>Fecha:</strong> {{date}}</p>
  </div>
  <div class="divider"></div>
  <table class="services-table">
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      {{servicesRows}}
      <tr class="total-row">
        <td class="total-label">Total</td>
        <td class="total-value">{{total}}</td>
      </tr>
    </tbody>
  </table>
  <div class="footer">
    <p>Esta cotización es válida por 30 días.</p>
    <p>powered by actols</p>
  </div>
</div>
</body>
</html>
